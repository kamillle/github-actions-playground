name: Concurrency Test

on:
  workflow_dispatch:
    inputs:
      job_count:
        description: "実行するジョブの数"
        required: false
        default: "3"
        type: string

concurrency:
  group: concurrency-test
  cancel-in-progress: false

jobs:
  test-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Start Job 1
        run: |
          echo "Job 1 が開始されました: $(date)"
          echo "ジョブ1が30秒間実行中..."

      - name: Wait for 30 seconds
        run: sleep 30

      - name: Complete Job 1
        run: |
          echo "Job 1 が完了しました: $(date)"

  test-job-2:
    runs-on: ubuntu-latest
    steps:
      - name: Start Job 2
        run: |
          echo "Job 2 が開始されました: $(date)"
          echo "ジョブ2が30秒間実行中..."

      - name: Wait for 30 seconds
        run: sleep 30

      - name: Complete Job 2
        run: |
          echo "Job 2 が完了しました: $(date)"

  test-job-3:
    runs-on: ubuntu-latest
    steps:
      - name: Start Job 3
        run: |
          echo "Job 3 が開始されました: $(date)"
          echo "ジョブ3が30秒間実行中..."

      - name: Wait for 30 seconds
        run: sleep 30

      - name: Complete Job 3
        run: |
          echo "Job 3 が完了しました: $(date)"

  summary:
    runs-on: ubuntu-latest
    needs: [test-job-1, test-job-2, test-job-3]
    steps:
      - name: Summary
        run: |
          echo "=== Concurrency Test 完了 ==="
          echo "すべてのジョブが順次実行されました"
          echo "完了時刻: $(date)"
